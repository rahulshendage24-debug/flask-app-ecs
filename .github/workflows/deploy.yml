name: Build and Deploy Flask App to Amazon Linux EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Flask Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deploy to Amazon Linux via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }} # यह अपने आप 'ec2-user' उठा लेगा
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Amazon Linux EC2 से कनेक्शन स्थापित हो गया है ---"
            
            # GitHub Registry में लॉगिन करें
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # पुराने कंटेनर को क्लीन करें
            docker stop flask-app || true
            docker rm flask-app || true
            
            # नई Flask इमेज पुल (Download) करें
            docker pull ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:latest
            
            # कंटेनर को रन करें
            docker run -d --name flask-app -p 5000:5000 ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:latest
            
            echo "--- डिप्लॉयमेंट सफलतापूर्वक पूरा हुआ! ---"
